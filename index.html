      const slide = slides[index - 1];
      if (!slide) return;

      // Update Navigation State
      currentSlideNum.textContent = String(slide.id).padStart(2, '0');
      slideCategory.textContent = slide.category;
      slideWatermark.textContent = `Slide ${slide.id} of ${totalSlides}`;

      const pct = Math.round((slide.id / totalSlides) * 100);
      progressBar.style.width = `${pct}%`;
      progressPercent.textContent = `${pct}%`;

      btnPrev.disabled = (slide.id === 1);
      btnNext.disabled = (slide.id === totalSlides);

      // Animation transition
      slideContent.style.opacity = '0';
      slideContent.style.transform = 'translateY(6px)';

      setTimeout(() => {
        slideContent.innerHTML = `
          <div>
            <div class="flex items-center gap-2 mb-1">
              <span class="px-2.5 py-0.5 rounded-full text-[10px] font-bold uppercase tracking-wider bg-emerald-500/15 text-emerald-400 border border-emerald-500/30">
                ${slide.category}
              </span>
              <span class="text-xs text-slate-400 font-mono">0${slide.id} / ${totalSlides}</span>
            </div>
            <h2 class="text-xl md:text-2xl font-bold text-white tracking-tight">
              ${slide.title}
            </h2>
            <p class="text-xs md:text-sm text-slate-400 mt-0.5 mb-4 font-normal">
              ${slide.subtitle}
            </p>
          </div>
          <div class="flex-1 flex flex-col justify-center">
            ${slide.render()}
          </div>
        `;
        slideContent.style.opacity = '1';
        slideContent.style.transform = 'translateY(0)';

        // Update speaker notes
        notesContent.textContent = slide.notes || "暫無講師備註";

        // Bind interactive events for specific slides
        bindSlideEvents(slide.id);
      }, 150);
    }

    function goToSlide(num) {
      if (num >= 1 && num <= totalSlides) {
        currentSlide = num;
        renderSlide(currentSlide);
        closeOverview();
      }
    }

    function nextSlide() {
      if (currentSlide < totalSlides) {
        currentSlide++;
        renderSlide(currentSlide);
      }
    }

    function prevSlide() {
      if (currentSlide > 1) {
        currentSlide--;
        renderSlide(currentSlide);
      }
    }

    // Interactive event bindings
    function bindSlideEvents(id) {
      // Slide 9: Interactive String Sandbox
      if (id === 9) {
        const inp = document.getElementById('inputTestStr');
        const outLen = document.getElementById('outLen');
        const outClean = document.getElementById('outClean');
        const outValid = document.getElementById('outValid');

        function updateStr() {
          const raw = inp.value;
          outLen.textContent = `${raw.length} 碼`;
          // Clean: trim, clean, upper, remove - and space
          let cleaned = raw.trim().toUpperCase().replace(/[- /]/g, '');
          outClean.textContent = cleaned || '(空值)';
          if (cleaned.length === 11) {
            outValid.textContent = '✓ 符合 ISO 11 碼標準';
            outValid.className = 'text-emerald-400 font-bold';
          } else {
            outValid.textContent = `⚠️ 長度為 ${cleaned.length} 碼 (非 11 碼)`;
            outValid.className = 'text-amber-400 font-bold';
          }
        }
        inp.addEventListener('input', updateStr);
        updateStr();
      }

      // Slide 15: Demurrage Slider
      if (id === 15) {
        const sDays = document.getElementById('sliderDays');
        const tDays = document.getElementById('txtOverDays');
        const tFee = document.getElementById('txtDemFee');
        const tStep = document.getElementById('txtTierStep');

        function calcDem() {
          const d = parseInt(sDays.value);
          tDays.textContent = `超期 ${d} 天`;
          let fee = 0;
          let desc = '';
          if (d <= 0) {
            fee = 0;
            desc = '0天 (在免費期內，無需付費)';
          } else if (d <= 3) {
            fee = d * 50;
            desc = `${d}天 × $50 = $${fee}`;
          } else if (d <= 7) {
            fee = 3 * 50 + (d - 3) * 100;
            desc = `3天×$50 + ${d - 3}天×$100 = $${fee}`;
          } else {
            fee = 3 * 50 + 4 * 100 + (d - 7) * 150;
            desc = `3天×$50 + 4天×$100 + ${d - 7}天×$150 = $${fee}`;
          }
          tFee.textContent = `$${fee} USD`;
          tStep.textContent = `計算式: ${desc}`;
        }
        sDays.addEventListener('input', calcDem);
        calcDem();
      }
    }

    // Toggle Speaker Notes
    function toggleNotes() {
      notesDrawer.classList.toggle('hidden');
    }

    // Fullscreen Toggle
    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
      } else {
        if (document.exitFullscreen) {
          document.exitFullscreen();
        }
      }
    }

    // Overview Grid Modal
    function buildThumbnails() {
      thumbGrid.innerHTML = '';
      slides.forEach(s => {
        const item = document.createElement('div');
        const isCurrent = (s.id === currentSlide);
        item.className = `p-3 rounded-xl border cursor-pointer transition flex flex-col justify-between h-28 ${
          isCurrent 
            ? 'bg-emerald-950/60 border-emerald-500 shadow-lg shadow-emerald-900/30 ring-1 ring-emerald-500' 
            : 'bg-slate-800/80 border-slate-700 hover:border-slate-500 hover:bg-slate-750'
        }`;
        item.onclick = () => goToSlide(s.id);
        item.innerHTML = `
          <div class="flex items-center justify-between text-[10px]">
            <span class="font-mono text-emerald-400 font-bold">0${s.id}</span>
            <span class="text-slate-400 truncate max-w-[80px]">${s.category}</span>
          </div>
          <div class="text-xs font-semibold text-white line-clamp-2 my-auto">${s.title}</div>
          <div class="text-[10px] text-slate-400">點擊跳轉</div>
        `;
        thumbGrid.appendChild(item);
      });
    }

    function toggleOverview() {
      buildThumbnails();
      overviewModal.classList.toggle('hidden');
    }

    function closeOverview() {
      overviewModal.classList.add('hidden');
    }

    // Event Listeners
    btnPrev.addEventListener('click', prevSlide);
    btnNext.addEventListener('click', nextSlide);
    document.getElementById('btnNotes').addEventListener('click', toggleNotes);
    document.getElementById('btnFullscreen').addEventListener('click', toggleFullscreen);
    document.getElementById('btnOverview').addEventListener('click', toggleOverview);
    document.getElementById('btnCloseOverview').addEventListener('click', closeOverview);

    // Keyboard Shortcuts
    document.addEventListener('keydown', (e) => {
      if (overviewModal.classList.contains('hidden')) {
        if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'PageDown') {
          e.preventDefault();
          nextSlide();
        } else if (e.key === 'ArrowLeft' || e.key === 'PageUp') {
          e.preventDefault();
          prevSlide();
        } else if (e.key.toLowerCase() === 'n') {
          toggleNotes();
        } else if (e.key.toLowerCase() === 'f') {
          toggleFullscreen();
        } else if (e.key.toLowerCase() === 'g') {
          toggleOverview();
        } else if (e.key === 'Home') {
          goToSlide(1);
        } else if (e.key === 'End') {
          goToSlide(totalSlides);
        }
      } else {
        if (e.key === 'Escape') {
          closeOverview();
        }
      }
    });

    // Initial render
    renderSlide(currentSlide);
  </script>
</body>
</html>
